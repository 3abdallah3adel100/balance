name: Meta Budget Report

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview reports in Actions logs without sending WhatsApp"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: meta-budget-report
  cancel-in-progress: false

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_ACCESS_TOKEN_2: ${{ secrets.META_ACCESS_TOKEN_2 }}
      TAHER_BUSINESS_IDS: ${{ vars.TAHER_BUSINESS_IDS || '751488620224306,1178859133269743,1370772291128896' }}
      META_API_VERSION: ${{ vars.META_API_VERSION || 'v26.0' }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_API_VERSION: ${{ vars.WHATSAPP_API_VERSION || 'v26.0' }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python files
        run: python -m compileall -q .

      - name: Fetch Meta data and send reports
        run: python run_reports.py
